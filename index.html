<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5dbb63">
<title>TKGたまごんと話し方れんしゅう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2a26; --sub:#6b645b; --cream:#fff9e8; --yolk:#f6a23c; --yolk2:#ffd36b;
  --green:#5dbb63; --green2:#3f9a46; --blue:#4f8fd8; --pink:#f4a3ae; --line:#efe6cf;
  --card:#ffffff; --good:#e8f7e9; --tip:#fff4d6; --grow:#ffe9f0;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"BIZ UDPGothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color:var(--ink); font-size:19px; line-height:1.75;
  background:
    radial-gradient(circle at 8% 10%, rgba(255,211,107,.35), transparent 30%),
    radial-gradient(circle at 92% 85%, rgba(93,187,99,.18), transparent 35%),
    var(--cream);
  min-height:100vh;
}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
ruby rt{font-size:.5em;color:#6b645b;font-weight:700}
.round{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif}
.hidden{display:none!important}

/* ===== ヘッダー ===== */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:4px solid var(--green);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hd{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .egg{width:44px;height:44px;flex:0 0 44px}
.logo .unit{font-size:12px;font-weight:700;color:var(--green2);background:var(--good);border-radius:999px;padding:1px 10px;display:inline-block}
.logo h1{font-size:21px;margin:0;line-height:1.35;font-weight:800}
.hd .tools{margin-left:auto;display:flex;gap:8px}
.tbtn{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:46px;padding:4px 12px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
.tbtn:active{transform:scale(.96)}
.steps{max-width:1240px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;min-width:84px;text-align:center;font-size:13px;font-weight:700;padding:4px 8px;border-radius:999px;background:#f3eee0;color:#9a917f;white-space:nowrap}
.step.done{background:var(--good);color:var(--green2)}
.step.now{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green2)}

/* ===== レイアウト ===== */
.layout{max-width:1240px;margin:0 auto;padding:14px 16px calc(28px + var(--safe-b));display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.stage{position:sticky;top:120px;display:flex;flex-direction:column;align-items:center;gap:10px}
.tamawrap{width:100%;max-width:300px;position:relative}
#tama{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:relative;width:100%;background:#fff;border:3px solid var(--green);border-radius:22px;padding:14px 16px;font-size:20px;font-weight:700;line-height:1.7;box-shadow:0 5px 0 rgba(63,154,70,.25);min-height:80px}
.bubble::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-bottom-color:var(--green);border-top:0}
.bubble::after{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:#fff;border-top:0}
.bubble .who{display:block;font-size:13px;color:var(--green2);margin-bottom:2px}
.voicebar{display:flex;gap:8px;width:100%;flex-wrap:wrap;align-items:center}
.vbtn{flex:1;min-height:52px;border-radius:16px;border:2px solid #cfe8d1;background:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.vbtn:active{transform:scale(.97)}
.vbtn.stop{border-color:#f5c2c2;color:#c0392b}
.speaking-ind{width:100%;text-align:center;font-weight:800;color:var(--green2);font-size:15px;min-height:22px}
.speaking-ind .bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.speaking-ind .bars i{width:4px;height:14px;background:var(--green);border-radius:2px;animation:eq .6s ease-in-out infinite}
.speaking-ind .bars i:nth-child(2){animation-delay:.15s}.speaking-ind .bars i:nth-child(3){animation-delay:.3s}
@keyframes eq{50%{transform:scaleY(.35)}}

.work{min-width:0}
.next{display:flex;align-items:center;gap:10px;background:var(--green);color:#fff;border-radius:18px;padding:10px 16px;font-weight:800;font-size:19px;margin-bottom:14px;box-shadow:0 4px 0 var(--green2)}
.next .arrow{font-size:24px;animation:poke 1.2s ease-in-out infinite}
@keyframes poke{50%{transform:translateX(5px)}}

@media (max-width:980px), (orientation:portrait) and (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .stage{position:static;flex-direction:row;flex-wrap:wrap;align-items:flex-start;background:rgba(255,255,255,.6);border-radius:22px;padding:8px}
  .tamawrap{width:150px;flex:0 0 150px}
  .stagecol{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
  .bubble::before,.bubble::after{top:28px;left:-14px;margin:0;border:12px solid transparent;border-right-color:var(--green);border-left:0}
  .bubble::after{left:-9px;top:31px;border-width:9px;border-right-color:#fff}
}
@media (min-width:981px) and (orientation:landscape), (min-width:1101px){ .stagecol{width:100%;display:flex;flex-direction:column;gap:10px} }

/* ===== カード・ボタン ===== */
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px;border:2px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.05)}
.card h2{font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:800}
.card h2 .ic{font-size:26px}
.card.good{background:var(--good);border-color:#bfe5c2}
.card.tip{background:var(--tip);border-color:#f3d48f}
.card.grow{background:var(--grow);border-color:#f7bfd0}
.card.self{background:#eef5ff;border-color:#c8dcf6}
.btn{border:none;border-radius:18px;min-height:60px;padding:10px 22px;font-size:20px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#ffc95c,var(--yolk));color:#5a3200;box-shadow:0 5px 0 #c97a1c}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c97a1c}
.btn.green{background:linear-gradient(180deg,#7ad37f,var(--green));color:#fff;box-shadow:0 5px 0 var(--green2)}
.btn.green:active{box-shadow:0 1px 0 var(--green2)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 #e6dcc3}
.btn.ghost:active{box-shadow:0 1px 0 #e6dcc3}
.btn.blue{background:linear-gradient(180deg,#7fb3ea,var(--blue));color:#fff;box-shadow:0 5px 0 #33689f}
.btn.small{min-height:48px;font-size:16px;padding:6px 14px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1;min-width:200px}
.muted{color:var(--sub);font-size:15px}
.note{font-size:14px;color:var(--sub);line-height:1.6}
label.f{display:block;font-weight:800;margin:12px 0 6px}
input[type=text],input[type=password],textarea{width:100%;border:3px solid #e6dcc3;border-radius:16px;padding:12px 14px;font-size:20px;background:#fff;outline:none;line-height:1.7}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(93,187,99,.2)}
textarea{min-height:150px;resize:vertical}
textarea[readonly]{background:#fbfaf5}
.count{font-size:14px;color:var(--sub);text-align:right;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:18px;font-weight:700;min-height:52px}
.chip.on{border-color:var(--green);background:var(--good);color:var(--green2)}
.err{background:#ffeaea;border:2px solid #f5b5b5;color:#9b2c2c;border-radius:14px;padding:10px 14px;font-weight:700;margin-top:10px}

/* ===== マイク ===== */
.micbox{display:flex;align-items:center;gap:16px;margin:6px 0 12px;flex-wrap:wrap}
.mic{width:120px;height:120px;border-radius:50%;border:none;flex:0 0 120px;background:radial-gradient(circle at 50% 35%,#ffe08a,var(--yolk));box-shadow:0 6px 0 #c97a1c,0 0 0 6px #fff,0 0 0 9px #f3d48f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#5a3200;position:relative}
.mic .mi{font-size:46px;line-height:1}
.mic:active{transform:translateY(3px)}
.mic.on{background:radial-gradient(circle at 50% 35%,#ff9b9b,#e54848);color:#fff;box-shadow:0 6px 0 #a42d2d,0 0 0 6px #fff,0 0 0 9px #f5b5b5;animation:micpulse 1.4s ease-in-out infinite}
@keyframes micpulse{50%{box-shadow:0 6px 0 #a42d2d,0 0 0 10px #fff,0 0 0 18px rgba(229,72,72,.25)}}
.mic.off{background:#ddd;box-shadow:0 6px 0 #aaa;color:#777}
.micside{flex:1;min-width:220px}
.micstat{font-weight:800;font-size:18px}
.micstat.on{color:#c0392b}
.waves{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.waves i{width:5px;height:18px;border-radius:3px;background:#e54848;animation:eq .5s ease-in-out infinite}
.waves i:nth-child(2){animation-delay:.1s}.waves i:nth-child(3){animation-delay:.2s}.waves i:nth-child(4){animation-delay:.3s}
.live{margin-top:6px;font-size:17px;color:#8a8273;background:#fffdf5;border:2px dashed #eadfbf;border-radius:12px;padding:6px 10px;min-height:40px}
.kbhint{font-size:14px;color:var(--sub);margin-top:4px}

/* ===== 会話ログ ===== */
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:92%}
.msg .av{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--cream);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.msg .av svg{width:44px;height:44px}
.msg .tx{background:#fff;border:2px solid #cfe8d1;border-radius:6px 20px 20px 20px;padding:10px 14px;font-size:19px;font-weight:700}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .av{font-size:24px;background:#fff4d6}
.msg.me .tx{background:#fff4d6;border-color:#f3d48f;border-radius:20px 6px 20px 20px;font-weight:500}
.msg.q .tx{border-color:var(--green);box-shadow:0 0 0 3px rgba(93,187,99,.15)}
.qcount{font-size:14px;font-weight:800;color:var(--green2)}

/* ===== チェックリスト ===== */
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.ck{border-radius:14px;padding:8px 6px;text-align:center;font-weight:800;font-size:16px;border:2px solid #e6e1d3;background:#f7f5ef;color:#aaa294}
.ck .i{font-size:24px;display:block;line-height:1.2;filter:grayscale(1);opacity:.5}
.ck.on{background:#fff;border-color:var(--green);color:var(--green2)}
.ck.on .i{filter:none;opacity:1}
.ck .s{display:block;font-size:12px;font-weight:700}
.parts{display:flex;gap:6px;margin-top:10px}
.part{flex:1;text-align:center;border-radius:12px;padding:8px 4px;font-weight:800;background:#f7f5ef;color:#aaa294;border:2px solid #e6e1d3}
.part.on{background:#fff4d6;border-color:var(--yolk);color:#9a5a0f}
.say{font-size:20px;font-weight:700;line-height:1.75}
.ex{margin-top:8px;background:#fff;border:2px dashed #f3d48f;border-radius:14px;padding:8px 12px;font-size:17px}
.growlist{margin:0;padding-left:0;list-style:none}
.growlist li{background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:8px;font-weight:700;font-size:19px;display:flex;gap:8px;align-items:flex-start}
.growlist li .gi{font-size:22px}

/* 自己評価 */
.selfrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:2px dashed #d7e5f8}
.selfrow:last-child{border-bottom:none}
.selfrow .lab{flex:1;min-width:210px;font-weight:800}
.selfrow .lab small{display:block;font-weight:500;font-size:14px;color:var(--sub)}
.faces{display:flex;gap:6px}
.face{border:3px solid #d7e5f8;background:#fff;border-radius:14px;min-width:78px;min-height:58px;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.face b{font-size:24px}
.face.on{border-color:var(--blue);background:#dcebff}

/* 組み立てメモ */
.memo{display:grid;gap:10px}
.memo .mrow{border-radius:16px;padding:10px;border:2px solid}
.memo .mrow textarea{min-height:76px;font-size:18px}
.memo .h{border-color:#f3d48f;background:#fffaf0}
.memo .n{border-color:#bfe5c2;background:#f4fbf4}
.memo .o{border-color:#c8dcf6;background:#f4f8ff}
.memo .t{font-weight:800;margin-bottom:4px}
.memo .t small{font-weight:500;color:var(--sub);font-size:14px;margin-left:6px}
.memoview .mrow{border-radius:14px;padding:8px 12px;margin-bottom:8px;border:2px solid}
.memoview .mrow .t{font-weight:800;font-size:15px}

/* くらべる */
.cmp{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.cmpcol{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px}
.cmpcol h3{margin:0 0 6px;font-size:19px}
.cmpcol .txt{font-size:17px;background:#fffdf5;border-radius:12px;padding:8px 10px;max-height:220px;overflow:auto;margin-bottom:8px;white-space:pre-wrap}
.cmpcol .mini{font-size:15px;margin-top:6px}
.bars2 .row{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin-bottom:10px}
.bars2 .lab{font-weight:800;font-size:16px}
.bars2 .tr{display:flex;flex-direction:column;gap:4px}
.bars2 .b{height:22px;border-radius:11px;background:#f0ebdc;position:relative;overflow:hidden}
.bars2 .b i{position:absolute;left:0;top:0;bottom:0;border-radius:11px;background:#f3c36b}
.bars2 .b.last i{background:var(--green)}
.bars2 .b span{position:absolute;left:10px;top:0;font-size:13px;font-weight:800;line-height:22px}
.stamps{display:flex;gap:10px;flex-wrap:wrap;font-size:40px}
.stampbig{display:inline-flex;flex-direction:column;align-items:center;border:4px solid #e54848;color:#e54848;border-radius:50%;width:120px;height:120px;justify-content:center;font-weight:800;transform:rotate(-8deg);background:#fff;animation:stamp .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:scale(2) rotate(-20deg);opacity:0}}
.hist{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;background:#fff}
.hist .ht{flex:1;font-weight:800}
.hist .ht small{display:block;font-weight:500;color:var(--sub);font-size:14px}

/* モーダル */
.mbg{position:fixed;inset:0;background:rgba(40,30,10,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:26px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;border:4px solid var(--green)}
.modal h3{margin:0 0 8px;font-size:22px}
.modal ol{padding-left:24px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:#2d2a26;color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;z-index:200;max-width:90vw;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.welcomeimg{width:100%;max-width:360px;display:block;margin:0 auto;border-radius:20px}
.tips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tips3 div{border-radius:14px;padding:8px 10px;font-size:16px;font-weight:700}
.tips3 .a{background:#fffaf0;border:2px solid #f3d48f}.tips3 .b{background:#f4fbf4;border:2px solid #bfe5c2}.tips3 .c{background:#f4f8ff;border:2px solid #c8dcf6}
.tips3 b{display:block;font-size:17px}
@media (max-width:640px){.tips3{grid-template-columns:1fr}.mic{width:100px;height:100px;flex-basis:100px}}
.pop{animation:popin .35s cubic-bezier(.2,1,.4,1)}
@keyframes popin{from{opacity:0;transform:translateY(10px)}}

/* ===== たまごんアニメーション ===== */
#tama .bodyg{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1deg)}}
#tama .armL{transform-box:fill-box;transform-origin:90% 95%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-10deg)}}
#tama .eyesOpen{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#tama .eyesHappy,#tama .think,#tama .listenMark{display:none}
#tama .mouth{transform-box:fill-box;transform-origin:50% 20%}
#tama.talking .mouth{animation:talk .26s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scaleY(.65)}50%{transform:scaleY(1.15)}}
#tama.talking .armL{animation-duration:.9s}
#tama.happy .eyesOpen{display:none}
#tama.happy .eyesHappy{display:inline}
#tama.happy .bodyg{animation:jump .7s ease-in-out 2}
@keyframes jump{50%{transform:translateY(-14px)}}
#tama.listening .eyesOpen{animation:none;transform:scale(1.18)}
#tama.listening .bodyg{animation:nod 1.1s ease-in-out infinite}
@keyframes nod{50%{transform:translateY(3px) rotate(2deg)}}
#tama.listening .listenMark{display:inline}
#tama.thinking .think{display:inline}
#tama.thinking .eyesOpen{animation:none;transform:translateY(-4px)}
#tama .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite}
#tama .spark:nth-of-type(2){animation-delay:.6s}#tama .spark:nth-of-type(3){animation-delay:1.2s}
@keyframes twinkle{50%{transform:scale(1.25) rotate(12deg);opacity:.75}}
#tama.happy .spark{animation-duration:.6s}
@media (prefers-reduced-motion:reduce){#tama *{animation:none!important}}
/* ===== 録音・声のふりかえり ===== */
.mic.rec{background:radial-gradient(circle at 50% 35%,#ffd0d0,#f27b7b);color:#fff;box-shadow:0 6px 0 #b54a4a,0 0 0 6px #fff,0 0 0 9px #f5c2c2}
.mic.rec .mi{font-size:40px}
.mic[disabled]{opacity:.5}
.lvl{height:14px;border-radius:7px;background:#f0ebdc;overflow:hidden;margin-top:6px}
.lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad37f,#f6c343,#f27b7b);transition:width .08s}
.recok{background:var(--good);border:2px solid #bfe5c2;border-radius:14px;padding:8px 12px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card.voice{background:#fbf8ff;border-color:#ddd0fb}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.vgraph{background:#fff;border:2px solid #e9e1fb;border-radius:16px;padding:6px;margin-bottom:8px}
.vgraph svg{width:100%;height:170px;display:block;cursor:pointer;touch-action:manipulation}
.gwrap{position:relative;padding-bottom:20px}
.gmarks{position:absolute;inset:0;pointer-events:none}
.gmarks .mk{position:absolute;transform:translateX(-50%);font-size:13px;font-weight:800;background:#dcebff;color:#2e6bb5;border-radius:6px;padding:0 4px;line-height:1.4}
.gmarks .mk.long{background:#ffe0e0;color:#c0392b}
.gmarks .mk.star{background:none;font-size:18px;top:-4px!important}
.gmarks .tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:12px;color:#8a8273}
.vlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--sub);padding:4px 6px}
.vlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.mtext{background:#fff;border:2px dashed #e1d6fa;border-radius:14px;padding:10px 12px;font-size:19px;line-height:2}
.mtext .q,.note .q{color:#b7ab95;font-size:.9em}
.mtext .l,.note .l{font-weight:800;text-decoration:underline;text-decoration-color:#f6a23c;text-decoration-thickness:4px}
.pz{display:inline-block;background:#dcebff;color:#2e6bb5;border-radius:8px;padding:0 4px;margin:0 3px;font-size:.8em;font-weight:800}
.pz.long{background:#ffe0e0;color:#c0392b}
.pz.big{font-size:1em;padding:2px 8px;margin:0 6px}
.vcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:10px}
.vcat{background:#fff;border:2px solid #ece4fb;border-radius:16px;padding:10px 12px}
.vcat .vt{font-weight:800;font-size:18px;margin-bottom:4px}
.vcat .vl{font-size:13px;background:#efe8ff;color:#6d4bd1;border-radius:999px;padding:1px 8px;margin-left:4px}
.vcat p{margin:4px 0;font-size:17px;line-height:1.6}
.vcat p.g{color:#2f7d36;font-weight:700}
.vcat p.t{color:#9a5a0f;font-weight:700}
.seg{border:2px solid #c8dcf6;background:#eef5ff;border-radius:10px;font-size:14px;font-weight:800;padding:2px 8px;min-height:34px;color:#2e6bb5}
.notice{margin-top:12px;background:#fff;border:2px solid #ece4fb;border-radius:16px;padding:10px 12px}
.notice .chip{font-size:16px;min-height:46px}
.vcmp{margin-bottom:8px}
.vtab{border-collapse:collapse;width:100%;font-size:16px;margin-top:6px;background:#fff}
.vtab th,.vtab td{border:2px solid #ece4fb;padding:6px 8px;text-align:center}
.vtab td:first-child{text-align:left;font-weight:800;white-space:nowrap}
.vtab .up{color:#2f9a3a;font-weight:800}.vtab .dn{color:#d9822b;font-weight:800}
.minibar{display:inline-block;width:90px;height:12px;border-radius:6px;background:#f0ebdc;overflow:hidden;vertical-align:middle}
.minibar i{display:block;height:100%;background:var(--green)}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.stylebtn{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px;text-align:left;min-height:70px}
.stylebtn b{display:block;font-size:18px}.stylebtn small{color:var(--sub);font-size:14px}
.stylebtn.on{border-color:#8b5cf6;background:#f3edff}
.styled{margin-top:10px;background:#fff;border:2px dashed #d9ccf7;border-radius:14px;padding:12px;font-size:22px;font-weight:700;line-height:1.9}
.styled.small{font-size:17px;padding:6px 10px;margin:6px 0}
.styled .emph{color:#d0392b;font-size:1.15em;text-decoration:underline;text-decoration-thickness:4px}
.styled .wow{color:#7c3aed}
.phase{margin-left:auto;background:#fff;color:var(--green2);border-radius:999px;padding:2px 12px;font-size:15px;white-space:nowrap;animation:blinkp 1.4s ease-in-out infinite}
@keyframes blinkp{50%{opacity:.6}}
.sndmeter{display:flex;align-items:flex-end;gap:4px;height:30px;margin-top:6px}
.sndmeter i{width:7px;height:6px;border-radius:3px;background:#d9d2c0;transition:height .12s}
.sndmeter.on i{background:var(--green);animation:snd .45s ease-in-out infinite}
.sndmeter.on i:nth-child(2){animation-delay:.07s}.sndmeter.on i:nth-child(3){animation-delay:.14s}.sndmeter.on i:nth-child(4){animation-delay:.21s}.sndmeter.on i:nth-child(5){animation-delay:.28s}.sndmeter.on i:nth-child(6){animation-delay:.35s}.sndmeter.on i:nth-child(7){animation-delay:.42s}
@keyframes snd{0%,100%{height:6px}50%{height:26px}}
.sndmeter span{font-size:14px;font-weight:800;color:var(--sub);margin-left:8px;align-self:center}
.sndmeter.on span{color:var(--green2)}
.lvlab{font-size:14px;font-weight:800;color:var(--sub);margin-top:4px}
.recsec{margin-top:14px;background:#fbf8ff;border:2px solid #ddd0fb;border-radius:18px;padding:12px}
.rech{margin:0 0 4px;font-size:18px}.rech small{font-size:13px;color:var(--sub);margin-left:8px;font-weight:700}
.ehead{font-weight:800;font-size:18px;margin-bottom:2px}
.qnote{background:#fffaf0;border:2px solid #f3d48f;border-radius:14px;padding:8px 10px;margin-bottom:12px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.qc{display:inline-flex;flex-direction:column;align-items:center;border-radius:12px;padding:3px 9px;font-size:14px;font-weight:800;background:#f3eee0;color:#9a917f;line-height:1.3}
.qc small{font-size:11px;font-weight:700}
.qc.ok{background:#e8f7e9;color:#2f7d36}.qc.ans{background:#dcebff;color:#2e6bb5}.qc.skip{background:#eee;color:#888}.qc.now{background:#fff;color:#c97a1c;border:2px solid #f3c36b}
.script{font-size:21px;line-height:2.1;background:#fff;border:2px dashed #e6dcc3;border-radius:16px;padding:12px 14px}
.cue.slow{background:#e8f7e9;border-radius:8px;padding:2px 4px}
.cue.feel{background:#ffe9f0;border-radius:8px;padding:2px 4px}
.take2{border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px;background:#fff}
.take2.latest{border-color:#bfe5c2;background:#fbfffb}
.tkno{font-size:19px}
.refbox{margin-top:6px;border-top:2px dashed #eee6cf;padding-top:6px}
.refbox summary{font-weight:800;min-height:40px;display:flex;align-items:center;cursor:pointer}
.refq{margin-top:8px;font-weight:800}
.refq .chip{font-size:15px;min-height:44px;padding:6px 12px}
.refmemo{margin-top:8px;font-size:17px!important}
.redo{background:#fff4d6;border:2px solid #f3d48f;border-radius:12px;padding:6px 10px;font-weight:800;margin-bottom:8px}
.cmpab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmpab>div{display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){.cmpab{grid-template-columns:1fr}}
.vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0}
.vcard{border:3px solid var(--line);background:#fff;border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px}
.vcard b{font-size:17px}.vcard small{font-size:13px;color:var(--sub);font-weight:700}
.vcard.on{border-color:var(--green);background:var(--good)}.vcard.on small{color:var(--green2)}
.vface{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.tlink{border:none;background:none;color:#a39a87;font-size:13px;font-weight:700;padding:6px;min-height:36px;text-decoration:underline}
.tview{position:fixed;inset:0;z-index:90;background:#fff6ea;overflow:auto;-webkit-overflow-scrolling:touch}
.tbar{position:sticky;top:0;z-index:2;background:#e8892b;color:#fff;font-weight:800;font-size:18px;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.tbar .btn{margin-left:auto;background:#fff;color:#a65a10;box-shadow:0 4px 0 #b86a1c}
.tbody{max-width:900px;margin:0 auto;padding:14px 16px calc(20px + var(--safe-b))}
.trow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #eadfc8;flex-wrap:wrap}
.trow .tname{flex:1;min-width:160px;font-weight:700}
.tlist{max-height:420px;overflow:auto;margin-top:8px;border:2px solid var(--line);border-radius:14px;padding:4px 10px;background:#fff}
.tag{background:var(--good);color:var(--green2);border-radius:999px;padding:1px 8px;font-size:12px}
body.tmode{overflow:hidden}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #cfe8d1;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.credit{font-size:12px;color:var(--sub);font-weight:500;margin-top:2px}
.vverr{background:#fff3f3;border:2px solid #f5c2c2;color:#9b2c2c;border-radius:12px;padding:6px 10px;font-size:14px;text-align:left}
.vverr .btn{margin-top:6px}
.yourturn{animation:turn 1.1s ease-in-out infinite!important}
@keyframes turn{50%{box-shadow:0 6px 0 #c97a1c,0 0 0 8px #fff,0 0 0 16px rgba(93,187,99,.45)}}

.rng{width:100%;height:36px;accent-color:var(--green)}
.sel{width:100%;font-size:18px;min-height:48px;border:3px solid #e6dcc3;border-radius:14px;padding:6px 10px;background:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:6px}
.chk input{width:22px;height:22px;flex:0 0 22px}
.take{border:2px solid #ece4fb;border-radius:16px;padding:10px;margin-top:10px;background:#fff}

function splitSentences(t) {
  const out = []; let buf = '', depth = 0; const str = String(t);
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (c === '「' || c === '『') depth++;
    if ((c === '」' || c === '』') && depth > 0) depth--;
    if (c === '\n') { if (buf.trim()) out.push(buf.trim()); buf = ''; continue; }
    buf += c;
    if (depth === 0 && /[。！？!?]/.test(c) && !/[。！？!?」]/.test(str[i + 1] || '')) { out.push(buf.trim()); buf = ''; }
  }
  if (buf.trim()) out.push(buf.trim());
  return out.filter(x => x.replace(/[。！？!?、\s]/g, '').length > 0);
}

/* --- 再生 --- */
const Players = {};

  const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  const a = new Audio(); a.src = url; a.preload = 'auto';

  a.addEventListener('ended', () => { stopPlayer(gid); const f = PlayEnd[gid]; if (f) { delete PlayEnd[gid]; f(); } });
  Players[gid] = p; return p;
}

function stopPlayer(gid) {
  const p = Players[gid]; if (!p) return;
  try { p.audio.pause(); } catch (e) { }
  cancelAnimationFrame(p.raf); p.stopAt = null;
  const c = document.getElementById('cur-' + gid); if (c) c.style.display = 'none';
  document.querySelectorAll(`[data-g="${gid}"].pbtn`).forEach(b => b.innerHTML = '▶ 聞く');

  TTS.stop(); stopAllPlayers(gid);

  if (!p) { toast('録音が見つからないよ（けしたか、保存できなかったみたい）'); return; }
  if (!p.audio.paused && from == null) { stopPlayer(gid); return; }
  try { p.audio.currentTime = from || 0; } catch (e) { }
  p.stopAt = to || null;
  try { await p.audio.play(); } catch (e) { toast('再生できなかったよ。もう一度おしてね'); return; }
  document.querySelectorAll(`[data-g="${gid}"].pbtn`).forEach(b => b.innerHTML = '⏸ 止める');
  const svg = document.getElementById('g-' + gid), c = document.getElementById('cur-' + gid);
  const D = svg ? +svg.dataset.dur : 0;
  const tick = () => {
    const t = p.audio.currentTime;

const SpeakRec = {
  on: false, busy: false, timer: null, replaceId: null,
  async start(replaceId) {

    TTS.stop(); stopAllPlayers();

    try {
      await Rec.start(rms => { const d = 20 * Math.log10(rms + 1e-7); const b = $('lvlBar'); if (b) b.style.width = Math.min(100, VOL_PCT(d)) + '%'; const l = $('lvlLab'); if (l) l.textContent = d < -50 ? '🔈 声が聞こえないよ' : d < -38 ? '🔉 もう少し大きな声で' : d < -12 ? '🔊 いい大きさ！' : '📢 大きすぎるかも'; });
    } catch (e) {
      this.busy = false;
      const name = e && e.name;
      const msg = IN_FRAME ? FRAME_MSG : name === 'NotAllowedError' ? 'マイクの使用が許可されていないよ。「設定」→「Safari」→「マイク」を「確認」か「許可」にして、ページを開きなおしてね。' : name === 'NotFoundError' ? 'マイクが見つからないよ。' : name === 'NotReadableError' || name === 'AbortError' ? 'マイクをほかの機能が使っているみたい。2〜3秒待ってから、もう一度おしてね。' : '録音を始められなかったよ。もう一度おしてみてね。';
      if (eb) { eb.innerHTML = `<div class="ehead">🎤 録音できないよ</div><div>${msg}</div><div class="note" style="margin-top:4px">録音できなくても、文章を見ながら声に出して練習できるよ。</div>`; eb.classList.remove('hidden'); }
      say('録音がうまくできへんみたい。文章を見ながら、声に出して練習してみてな！', 'thinking', { speak: false });
      return;
    }
    this.busy = false; this.on = true;
    const s = sess();
    const b = $('spRec'); if (b) { b.classList.add('on'); b.innerHTML = '<span class="mi">⏹</span>おわったら<br>おす'; }
    const rb = $('redoBanner'); if (rb && this.replaceId) { const t = s.takes.find(x => x.id === this.replaceId); rb.textContent = `🔁 ${t ? t.no : ''}回目を、とりなおしているよ`; rb.classList.remove('hidden'); }
    setExpr('listening'); refreshPhase();
    const t0 = performance.now();
    this.timer = setInterval(() => {
      const el = Rec.elapsed(); const st = $('spStat');
      if (st) st.innerHTML = `<span style="color:#c0392b">⏺ 録音中 ${mmss(el)}</span> <span class="waves"><i></i><i></i><i></i><i></i></span><br><span style="font-size:15px">話しおわったら、赤いボタンをおしてね</span>`;
      if (performance.now() - t0 > 2500 && !Rec.lastSound) { const l = $('lvlLab'); if (l) l.textContent = '⚠️ 音が入っていないみたい。マイクがふさがっていないか、たしかめてね。'; }
      if (el >= 180) this.stop();
    }, 400);
  },
  async stop() {
    if (!this.on) return;
    this.on = false; clearInterval(this.timer);
    const s = sess(); const at = s.attempts[s.attempts.length - 1];
    const b = $('spRec'); if (b) { b.classList.remove('on'); b.disabled = true; b.innerHTML = '<span class="mi">⏳</span>しらべ中'; }
    const st = $('spStat'); if (st) st.textContent = '🔍 録音をしまっているよ…';
    analyzingNow = true; refreshPhase();
    const r = await Rec.stop();
    setExpr('thinking');
    await new Promise(res => setTimeout(res, 30));
    let v = null; try { v = r ? analyzeVoice(r.pcm, r.sr) : null; } catch (e) { v = null; }
    analyzingNow = false; refreshPhase();
    if (b) b.disabled = false;
    if (!v || v.empty) {
      vSpeak();
      const eb = $('recErr'); if (eb) { eb.innerHTML = '<div class="ehead">👂 声が録音できていなかったよ</div><div>マイク（iPhone・iPadの下のほう）に近づいて、もう一度おしてね。</div>'; eb.classList.remove('hidden'); }
      setExpr('idle'); return;
    }
    const id = 'a' + uid();
    const saved = await AudioDB.put(id, wavBuffer(r.pcm, r.sr));
    const voice = voiceCompact(v, [], id);
    let take;
    if (this.replaceId && (take = s.takes.find(x => x.id === this.replaceId))) {
      if (take.voice && take.voice.audio) AudioDB.del(take.voice.audio);
      take.voice = voice; take.at = Date.now(); take.redo = true; take.ref = {};
    } else {
      s.takeNo = (s.takeNo || 0) + 1;
      take = { id: uid(), no: s.takeNo, at: Date.now(), attemptN: at.n, voice, ref: {} };
      s.takes.push(take);
    }
    this.replaceId = null;
    // 次の録音に向けたポイント（1〜2こ）
    s.lastPointKeys = (s.points || []).map(p => p.k);
    s.points = speakPoints(s); s.pointsFor = at.n;
    save();
    vSpeak();
    if (saved === false || !AudioDB.persistent) toast('この画面では録音を保存できないので、ページを閉じると消えるよ');
    setExpr('happy');
    say(`${take.no}回目の録音ができたで！ まずは「▶ 聞く」で、自分の声を聞いてみてな。`, 'happy');
    PlayEnd['k' + take.id] = () => say(`聞いてみてどうやった？ ふりかえりカードをつけてみてな。つぎのポイントは、${s.points.map(p => p.t).join(' それから、')}`, 'happy');
    const el = document.getElementById('tk-' + take.id); if (el && el.scrollIntoView) { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { } }
  }
};

    const echo = echoFirst(text, s.topic);

function teacherAuth() {
  const er = $('tErr'), inp = $('tPass'); if (!inp) return;
  if (Date.now() < tLockUntil) { er.textContent = `何回もまちがえたので、${Math.ceil((tLockUntil - Date.now()) / 1000)}秒まってください。`; er.classList.remove('hidden'); return; }
  if (fnv(inp.value) === TEACHER_HASH) { tFail = 0; teacherAuthed = true; closeModal(); openTeacher(); return; }
  tFail++; inp.value = '';
  if (tFail >= 5) { tLockUntil = Date.now() + 30000; tFail = 0; }
  er.textContent = 'パスワードがちがいます。'; er.classList.remove('hidden');
  const m = document.querySelector('.modal'); if (m) { m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }
}

/* =====================================================================
   7. ボタンの動き
   ===================================================================== */
function newSession() { const s = { id: uid(), created: Date.now(), topic: '', kind: '', attempts: [], qa: [], memo: null, draft: '', done: false }; S.sessions.push(s); if (S.sessions.length > 40) S.sessions.shift(); S.cur = s.id; save(); return s; }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (TEACHER_ACTS.has(a) && !teacherAuthed) { toast('これは先生用の設定です'); return; }
  switch (a) {
    case 'start': { const nm = $('nm'); S.name = nm ? nm.value.trim().slice(0, 10) : ''; newSession(); go('topic'); break; }
    case 'resume': { const s = sess(); if (!s.topic) go('topic'); else if (!s.attempts.length) go('talk'); else if (s.attempts.length === 1 && !s.attempts[0].advice) go('qa'); else go('advice', { adviceN: s.attempts.length }); break; }
    case 'kind': { const s = sess(); s.kind = el.dataset.k; save(); document.querySelectorAll('#kinds .chip').forEach(c => c.classList.toggle('on', c === el)); $('ideas').textContent = '💡 たとえば：' + IDEAS[s.kind].join(' ／ '); break; }
    case 'topic-ok': { const s = sess(); const t = $('topic').value.trim(); if (!t) return; s.topic = t; save(); go('talk'); break; }
    case 'mic': {
      const ta = $(el.dataset.ta); if (!ta) return;
      if (Mic.listening || Mic.want) { Mic.stop(); return; }
      if (!S.micExplained) { micExplainModal(el.dataset.ta); return; }
      Mic.start(ta); break;
    }
    case 'mic-go': { S.micExplained = true; save(); closeModal(); const ta = $(el.dataset.ta); if (ta) Mic.start(ta); break; }
    case 'kb-close': { closeModal(); const ta = $(el.dataset.ta); if (ta) ta.focus(); break; }
    case 'kb': { const ta = document.querySelector('#talkText,#ansText'); if (ta) { ta.readOnly = false; ta.focus(); } break; }
    case 'talk-done': submitTalk(); break;
    case 'rec-talk': if (RecTalk.on) RecTalk.stop(); else if (!S.recExplained) recInfoModal('talk'); else RecTalk.start(); break;
    case 'rec-info-ok': { S.recExplained = true; save(); closeModal(); if (el.dataset.next === 'speak') SpeakRec.start(el.dataset.id || null); else RecTalk.start(); break; }
    case 'rec-del': { const s = sess(); if (s.draftVoice) { AudioDB.del(s.draftVoice.audio); s.draftVoice = null; save(); } stopAllPlayers(); $('recDone').innerHTML = ''; toast('録音をけしたよ'); break; }
    case 'play': playVoice(el.dataset.g, el.dataset.a); break;
    case 'seg': playVoice(el.dataset.g, el.dataset.a, +el.dataset.from, +el.dataset.to); break;
    case 'seek': { const svg = el.closest('svg'); const btn = document.querySelector(`.pbtn[data-g="${el.dataset.g}"]`); if (!svg || !btn) break; const r = svg.getBoundingClientRect(); const t = Math.max(0, (e.clientX - r.left) / r.width * (+svg.dataset.dur)); playVoice(el.dataset.g, btn.dataset.a, t); break; }
    case 'notice': { const s = sess(); const at = s.attempts[+el.dataset.n - 1]; if (!at) break; at.notice = at.notice || []; const i = +el.dataset.i; const k = at.notice.indexOf(i); if (k >= 0) at.notice.splice(k, 1); else at.notice.push(i); save(); el.classList.toggle('on'); break; }
    case 'voice-del': { const s = sess(); const at = s.attempts[+el.dataset.n - 1]; if (at && at.voice) { AudioDB.del(at.voice.audio); at.voice.deleted = true; save(); stopAllPlayers(); render(); toast('録音をけしたよ（グラフはのこるよ）'); } break; }
    case 'speak': go('speak'); break;
    case 'sp-rec': if (SpeakRec.on) SpeakRec.stop(); else if (!S.recExplained) recInfoModal('speak'); else SpeakRec.start(); break;
    case 'sp-redo': if (SpeakRec.on) break; if (!S.recExplained) recInfoModal('speak', el.dataset.id); else { SpeakRec.start(el.dataset.id); try { $('spRec').scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { } } break;
    case 'sp-del': { const s = sess(); const t = s.takes.find(x => x.id === el.dataset.id); if (!t) break;
      modal(`<h3>🗑 ${t.no}回目の録音をけしますか？</h3><p>けした録音は、元にもどせないよ。</p><div class="btnrow"><button class="btn ghost" data-act="close">やめる</button><button class="btn" data-act="sp-del-yes" data-id="${t.id}" style="background:#e54848;color:#fff;box-shadow:0 5px 0 #a42d2d">けす</button></div>`); break; }
    case 'sp-del-yes': { const s = sess(); const i = s.takes.findIndex(x => x.id === el.dataset.id); if (i >= 0) { const t = s.takes.splice(i, 1)[0]; if (t.voice && t.voice.audio) AudioDB.del(t.voice.audio); save(); } closeModal(); stopAllPlayers(); vSpeak(); toast('録音をけしたよ'); break; }
    case 'ref': { const s = sess(); const t = s.takes.find(x => x.id === el.dataset.id); if (!t) break; t.ref = t.ref || {}; t.ref[el.dataset.k] = +el.dataset.v; save(); el.parentNode.querySelectorAll('.face').forEach(b => b.classList.toggle('on', b === el)); break; }
    case 'ref-chip': { const s = sess(); const t = s.takes.find(x => x.id === el.dataset.id); if (!t) break; t.ref = t.ref || {}; const k = el.dataset.k, v = el.dataset.v; const a = t.ref[k] = t.ref[k] || []; const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); save(); el.classList.toggle('on');
      if (k === 'next' && i < 0) say(`次は「${v}」をがんばるんやね！ ポイントを思い出して、もう一度録音してみよう！`, 'happy');
      if (k === 'better' && i < 0 && v !== 'とくにない') say(`「${v}」がよくなったと思ったんやね！ 自分で気づけるのが、すごいところやで！`, 'happy'); break; }
    case 'rec-text': S.settings.recText = el.dataset.v === '1'; save(); settingsModal(); break;
    case 'rec-clear': modal(`<h3>🗑️ 録音をすべてけしますか？</h3><p>このiPadにしまってある、すべての録音がきえます。話した文章やグラフはのこります。</p><div class="btnrow"><button class="btn ghost" data-act="close">やめる</button><button class="btn" data-act="rec-clear-yes" style="background:#e54848;color:#fff;box-shadow:0 5px 0 #a42d2d">けす</button></div>`); break;
    case 'rec-clear-yes': { AudioDB.clear(); S.sessions.forEach(x => { (x.attempts || []).forEach(a => { if (a.voice) a.voice.deleted = true; }); x.takes = []; if (x.draftVoice) x.draftVoice = null; }); save(); closeModal(); stopAllPlayers(); render(); renderTeacher(); toast('録音をすべてけしました'); break; }
    case 'answer': answerQ(false); break;
    case 'skip': answerQ(true); break;
    case 'to-advice': { const s = sess(); const x = s.qa[s.qa.length - 1]; if (x && !x.a && !x.skip) s.qa.pop(); save(); go('advice', { adviceN: 1 }); break; }
    case 'self': { const s = sess(); const at = s.attempts[(S.adviceN || s.attempts.length) - 1]; at.self[el.dataset.k] = +el.dataset.v; save(); el.parentNode.querySelectorAll('.face').forEach(b => b.classList.toggle('on', b === el)); break; }
    case 'again': { const s = sess(); s.done = false; save(); go('talk'); break; }
    case 'compare': go('compare'); break;
    case 'finish': go('finish'); break;
    case 'new': { newSession(); go('topic'); break; }
    case 'home': go('welcome'); break;
    case 'history': go('history'); break;
    case 'open': { S.cur = el.dataset.id; save(); go('compare'); break; }
    case 'clear-all': modal(`<h3>🗑️ 記録をすべてけしますか？</h3><p>話した文章やふりかえりが、すべてきえます。元にもどせません。</p><div class="btnrow"><button class="btn ghost" data-act="close">やめる</button><button class="btn" data-act="clear-yes" style="background:#e54848;color:#fff;box-shadow:0 5px 0 #a42d2d">けす</button></div>`); break;
    case 'clear-yes': { AudioDB.clear(); const keep = { name: S.name, settings: S.settings, micExplained: S.micExplained, recExplained: S.recExplained }; S = Object.assign(defState(), keep); save(); closeModal(); go('welcome'); toast('記録をけしました'); break; }
    case 'settings': if (teacherAuthed) break; settingsModal(); break;
    case 'kid-voice': { const id = +el.dataset.id; if (kidList().indexOf(id) < 0) break; S.vv = Object.assign(vvCfg(), { speaker: id }); save(); closeModal(); TTS.speak('この声で話すで！ いっしょに練習しよう！'); break; }
    case 'teacher-open': closeModal(); teacherLogin(); break;
    case 'teacher-auth': teacherAuth(); break;
    case 'teacher-close': closeTeacher(); break;
    case 't-try': case 't-set': case 't-kid-add': case 't-kid-del': case 't-reset': teacherClick(a, el); break;
    case 'vv-mode': { S.vv = Object.assign(vvCfg(), { mode: el.dataset.v }); save(); TTS.stop(); renderTeacher(); if (el.dataset.v !== 'browser') loadSpeakers(); break; }
    case 'vv-fb': S.vv = Object.assign(vvCfg(), { fallback: el.dataset.v === '1' }); save(); renderTeacher(); break;
    case 'vv-key-save': { const k = ($('vvKey').value || '').trim(); const keep = $('vvKeyKeep').checked; vvKeyMem = k; try { if (keep && k) localStorage.setItem(VV_KEY_STORE, k); else localStorage.removeItem(VV_KEY_STORE); } catch (e) { } VV.cache.clear(); toast(k ? (keep ? 'APIキーを保存しました' : 'APIキーをこのページを閉じるまで使います') : 'APIキーをけしました'); break; }
    case 'vv-key-clear': { vvKeyMem = ''; try { localStorage.removeItem(VV_KEY_STORE); } catch (e) { } VV.cache.clear(); renderTeacher(); toast('APIキーをけしました'); break; }
    case 'vv-points': { const k = vvKey(); const out = $('vvPoints'); if (!k) { out.textContent = '先にAPIキーを保存してください'; break; } out.textContent = '確認中…';
      fetch(`${VV_POINTS}?key=${encodeURIComponent(k)}`).then(r => r.json()).then(j => { out.textContent = j.errorMessage ? (VV_ERR[j.errorMessage] || j.errorMessage) : Object.entries(j).filter(([a]) => !/key/i.test(a)).map(([a, b]) => `${a}: ${typeof b === 'object' ? JSON.stringify(b) : b}`).join(' ／ '); }).catch(() => { out.textContent = VV_ERR.network; }); break; }
    case 'vv-test': TTS.speak('こんにちは！ ぼく、TKGたまごん。きみの話を聞かせてな！'); break;
    case 'tts-browser': TTS.browser([{ t: TTS.last }]); break;
    case 'tts-unblock': { VV.unlock(); const pd = TTS.pending; TTS.pending = null; if (pd) TTS.run(pd.parts, pd.onEnd); break; }
    case 'auto': S.settings.auto = el.dataset.v === '1'; save(); settingsModal(); if (!S.settings.auto) TTS.stop(); break;
    case 'close': closeModal(); break;
    case 'tts-replay': if (Mic.listening || RecTalk.on) { toast('マイクを止めてから聞いてね'); break; } TTS.speak($('bubbleText').textContent, yourTurn); break;
    case 'tts-stop': TTS.stop(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.target && e.target.id === 'topic') { e.preventDefault(); const b = $('topicOk'); if (b && !b.disabled) b.click(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (RecTalk.on) RecTalk.stop(); if (SpeakRec.on) SpeakRec.stop(); if (Mic.listening || Mic.want) Mic.abortSilently(); TTS.stop(); stopAllPlayers(); } });

/* 起動 */
render();
TTS.set('off');
// iPad：最初のタップで音声再生を使えるようにする
['pointerdown', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, () => VV.unlock(), { capture: true, passive: true }));
function loadSpeakers() {
  if (S.vvSpeakers && S.vvSpeakers.length) return;
  fetch(VV_SPEAKERS).then(r => r.json()).then(j => { if (j && j.success && Array.isArray(j.speakers)) { S.vvSpeakers = j.speakers; save(); if ($('tview')) renderTeacher(); else if (document.querySelector('.vcards')) settingsModal(); } }).catch(() => { });
}
document.addEventListener('input', e => {
  const t = e.target; const m = { vvSpeed: 'speed', vvPitch: 'pitch', vvInto: 'into' }[t.id];
  if (m && teacherAuthed) { S.vv = Object.assign(vvCfg(), { [m]: +t.value }); const lab = $(t.id + 'V'); if (lab) lab.textContent = (+t.value).toFixed(2); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (/^vv(Speed|Pitch|Into)$/.test(t.id) && teacherAuthed) TTS.speak('このくらいで話すで！');
});
</script>
</body>
